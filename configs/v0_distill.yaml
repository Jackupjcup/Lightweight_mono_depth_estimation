# Fast Mono Depth — Full Distillation Config (1/10 data, all targets from DA3 teacher)
#
# Usage:
#   torchrun --nproc_per_node=4 tools/train_distill.py --config configs/v0_tenth_distill.yaml

# ─── Model ───
model:
  input_height: 476
  input_width: 644
  backbone_pretrained: true
  dpt_features: 256
  dpt_out_channels: [256, 512, 1024, 1024]

# ─── Teacher ───
teacher:
  model_dir: /data-vepfs/lrd_projs/mono_body_dataset/Depth-Anything-3-main/models/DA3NESTED-GIANT-LARGE-1.1/
  da3_src: /data-vepfs/lrd_projs/mono_body_dataset/Depth-Anything-3-main/src

# ─── Data — LMDB ───
data:
  lmdb_path: /data-vepfs/lrd_projs/mono_depth_estimation/fast_mono_depth/data/tartanground.lmdb
  train_index: /data-vepfs/lrd_projs/mono_depth_estimation/fast_mono_depth/data/annotations/tartanground_train_twentieth.json
  val_index: /data-vepfs/lrd_projs/mono_depth_estimation/fast_mono_depth/data/annotations/tartanground_val_twentieth.json

  # Resolution
  input_height: 476
  input_width: 644

  # Ray computation (DA3 normalized [0,2] space)
  ray_height: 238          # input_height // 2
  ray_width: 322            # input_width // 2
  coord_system: ned         # TartanGround pose frame (NED c2w)
  ned_to_cv: [[0,0,1],[1,0,0],[0,1,0]]

  # valid_mask: depth < depth_cap
  depth_cap: 100.0          # depth >= cap → masked out & clipped

  # Augmentation
  augment: true
  ## Random Horizonal Flip
  flip_prob: 0.5

  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05

# ─── Training ───
training:
  # batch_size: train & val
  batch_size: 16
  val_batch_size: 32
  # num_workers: train & val
  num_workers: 4
  val_num_workers: 4

  learning_rate: 1.0e-4
  weight_decay: 0.05
  optimizer: adamw
  scheduler: cosine         # cosine | linear | constant
  warmup_epochs: 3
  hold_epochs: 0
  total_epochs: 100

# ─── Loss weights ───
loss:
  feat_weights: [1.0, 1.0, 1.0, 1.0]
  # Distillation task loss weights (depth raised to compete with feature loss)
  depth_weight: 10.0
  ray_weight: 1.0
  cam_weight: 1.0
  grad_weight: 1.0
  # Camera loss sub-weights
  cam_trans_weight: 1.0
  cam_rot_weight: 1.0
  cam_fov_weight: 0.5

# ─── Logging & checkpointing ───
logging:
  log_interval: 50        # 每 N 个 training step 打印+写 TensorBoard
  save_interval: 1         # 每 N 个 epoch 存 checkpoint
  eval_interval: 1          # 每 N 个 epoch 做 val 评估
  early_stop_patience: 10   # 连续 N 次 eval 无改善则停止
